# Vhost :80 de la web. Certbot (--apache) crea después el :443 y la redirección.
<VirtualHost *:80>
    ServerName arctiva.techmarc.es
    DocumentRoot /opt/vps-apps/arctiva-web/public

    <Directory /opt/vps-apps/arctiva-web/public>
        Options -Indexes -FollowSymLinks +SymLinksIfOwnerMatch
        AllowOverride None
        Require all granted
    </Directory>

    Header always set X-Content-Type-Options "nosniff"
    Header always set Referrer-Policy "no-referrer"
    Header always set X-Frame-Options "DENY"
    Header always set Content-Security-Policy "default-src 'none'; img-src 'self'; style-src 'self'; script-src 'unsafe-inline'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'"

    <IfModule mod_expires.c>
        ExpiresActive On
        ExpiresByType image/svg+xml "access plus 1 week"
        ExpiresByType text/css "access plus 1 hour"
        ExpiresByType text/html "access plus 5 minutes"
    </IfModule>
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css image/svg+xml application/xml text/plain
    </IfModule>

    ErrorLog ${APACHE_LOG_DIR}/arctiva.techmarc.es-error.log
    CustomLog ${APACHE_LOG_DIR}/arctiva.techmarc.es-access.log combined
</VirtualHost>
