<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <title>Arctiva</title>
  <defs>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="70" y1="440" x2="456" y2="80">
      <stop offset="0" stop-color="#1d4ed8" stop-opacity="0"/>
      <stop offset="0.45" stop-color="#1e5bd8" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#6fd6ff"/>
    </linearGradient>
    <linearGradient id="left" gradientUnits="userSpaceOnUse" x1="100" y1="430" x2="256" y2="92">
      <stop offset="0" stop-color="#0b2d8f"/>
      <stop offset="1" stop-color="#3d86ff"/>
    </linearGradient>
    <linearGradient id="right" gradientUnits="userSpaceOnUse" x1="256" y1="92" x2="412" y2="430">
      <stop offset="0" stop-color="#3d86ff"/>
      <stop offset="1" stop-color="#8fe6ff"/>
    </linearGradient>
    <linearGradient id="swoosh" gradientUnits="userSpaceOnUse" x1="40" y1="392" x2="494" y2="216">
      <stop offset="0" stop-color="#1d6ff2" stop-opacity="0.1"/>
      <stop offset="0.5" stop-color="#9be7ff"/>
      <stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <path id="swooshShape" d="M40,392 C160,300 320,222 476,212 C492,211 498,216 492,224 C330,250 170,322 40,392 Z"/>
    <path id="rightShape" d="M256,92 C332,92 392,250 412,430 L330,430 C316,300 290,168 256,168 Z"/>
    <mask id="cutBySwoosh" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#swooshShape" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
    </mask>
    <mask id="cutByRight" maskUnits="userSpaceOnUse" x="0" y="0" width="512" height="512">
      <rect width="512" height="512" fill="#fff"/>
      <use href="#rightShape" fill="#000" stroke="#000" stroke-width="12" stroke-linejoin="round"/>
    </mask>
  </defs>

  <circle cx="256" cy="250" r="200" fill="none" stroke="url(#ring)" stroke-width="12" opacity="0.35" filter="url(#glow)"/>
  <circle cx="256" cy="250" r="200" fill="none" stroke="url(#ring)" stroke-width="4"/>

  <path mask="url(#cutBySwoosh)" fill="url(#left)" d="M100,430 C120,250 180,92 256,92 L256,168 C224,168 196,300 160,430 Z"/>

  <g mask="url(#cutByRight)">
    <use href="#swooshShape" fill="#4cc3ff" opacity="0.7" filter="url(#glow)"/>
    <use href="#swooshShape" fill="url(#swoosh)"/>
  </g>

  <use href="#rightShape" fill="url(#right)"/>
</svg>
